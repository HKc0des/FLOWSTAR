<div id="flowstar-graphs">
  <style>
    #flowstar-graphs { color: var(--foreground); font: 14px/1.4 system-ui, sans-serif; }
    #flowstar-graphs .controls { display:flex; flex-wrap:wrap; gap:12px; margin:0 0 14px; }
    #flowstar-graphs button { background:transparent; border:0; color:var(--foreground); cursor:pointer; padding:2px 0; font:inherit; }
    #flowstar-graphs button[aria-pressed="true"] { text-decoration:underline; text-underline-offset:4px; }
    #flowstar-graphs .swatch { display:inline-block; width:10px; height:10px; margin-right:4px; background:var(--viz-series-1); }
    #flowstar-graphs .subtitle { margin:0 0 10px; color:var(--muted-foreground); }
    #flowstar-graphs svg { width:100%; display:block; margin:0 0 24px; overflow:visible; }
    #flowstar-graphs text { fill:var(--foreground); font-size:12px; }
    #flowstar-graphs .axis-title { font-size:13px; font-weight:600; }
    #flowstar-graphs .frame { fill:none; stroke:var(--border); }
    #flowstar-graphs .grid line { stroke:var(--border); stroke-opacity:.55; }
    #flowstar-graphs .value { font-size:11px; }
    #flowstar-graphs .note { font-size:12px; fill:var(--muted-foreground); }
  </style>
  <h3>FlowStar evaluation results</h3>
  <p class="subtitle">Mean across 10 seeds. Complete configurations shown: modes 0-4; modes 0-2 transmit no traffic in this implementation.</p>
  <div class="controls" aria-label="Workload selector"></div>
  <svg id="throughput" role="img" aria-label="Mean packets received by mode"></svg>
  <svg id="queue" role="img" aria-label="Mean maximum queue occupancy by mode"></svg>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById('flowstar-graphs');
  const rows = [
    [0,1,0,0],[0,2,0,0],[0,3,0,0],[0,4,0,0],[0,5,0,0],
    [1,1,0,0],[1,2,0,0],[1,3,0,0],[1,4,0,0],[1,5,0,0],
    [2,1,0,0],[2,2,0,0],[2,3,0,0],[2,4,0,0],[2,5,0,0],
    [3,1,2957974,301],[3,2,3951323,401],[3,3,10904766,1101],[3,4,3924852,101],[3,5,2214624,301],
    [4,1,2957974,301],[4,2,3951323,401],[4,3,10904766,1101],[4,4,3924852,101],[4,5,2214624,301]
  ].map(([mode, workload, rx, maxQueue]) => ({mode, workload, rx, maxQueue}));
  const modes = [{id:0,name:'NoCtrl'},{id:1,name:'BaseCC'},{id:2,name:'CBFC'},{id:3,name:'FlowStar'},{id:4,name:'FS+I1'}];
  const workloads = ['Bottleneck','Victim','Exhaustion','Multipath','Burst'];
  let selected = 1;
  const controls = d3.select(root).select('.controls');
  workloads.forEach((name, i) => {
    const b = controls.append('button').attr('type','button').attr('aria-pressed', i + 1 === selected).text(`W${i + 1}: ${name}`);
    b.on('click', () => { selected = i + 1; controls.selectAll('button').attr('aria-pressed', (_, j) => j + 1 === selected); draw(); });
  });
  function chart(id, title, key, axis) {
    const svg = d3.select(root).select(id);
    const width = Math.max(360, svg.node().clientWidth || root.clientWidth || 720), height = 330;
    const margin = {top:42,right:24,bottom:70,left:82};
    svg.attr('viewBox', `0 0 ${width} ${height}`).selectAll('*').remove();
    const data = modes.map(m => ({...m, ...rows.find(r => r.mode === m.id && r.workload === selected)}));
    const x = d3.scaleBand().domain(data.map(d => d.name)).range([margin.left,width-margin.right]).padding(.32);
    const max = d3.max(data, d => d[key]);
    const y = d3.scaleLinear().domain([0, max ? max * 1.15 : 1]).nice().range([height-margin.bottom,margin.top]);
    svg.append('text').attr('x',margin.left).attr('y',22).attr('font-size',16).attr('font-weight',650).text(title);
    svg.append('g').attr('class','grid').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(width-margin.left-margin.right)).tickFormat('')).call(g => g.select('.domain').remove());
    svg.append('rect').attr('class','frame').attr('x',margin.left).attr('y',margin.top).attr('width',width-margin.left-margin.right).attr('height',height-margin.top-margin.bottom);
    svg.append('g').attr('transform',`translate(0,${height-margin.bottom})`).call(d3.axisBottom(x));
    svg.append('g').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format('.2s')));
    svg.selectAll('.bar').data(data).join('rect').attr('class','bar').attr('x',d => x(d.name)).attr('width',x.bandwidth()).attr('y',d => y(d[key])).attr('height',d => y(0)-y(d[key])).attr('fill','var(--viz-series-1)');
    svg.selectAll('.value').data(data.filter(d => d[key] > 0)).join('text').attr('class','value').attr('text-anchor','middle').attr('x',d => x(d.name)+x.bandwidth()/2).attr('y',d => y(d[key])-6).text(d => d3.format('.3s')(d[key]));
    svg.append('text').attr('class','axis-title').attr('text-anchor','middle').attr('x',(margin.left+width-margin.right)/2).attr('y',height-15).text('Configuration mode');
    svg.append('text').attr('class','axis-title').attr('text-anchor','middle').attr('transform',`translate(20 ${(margin.top+height-margin.bottom)/2}) rotate(-90)`).text(axis);
  }
  function draw() { chart('#throughput','Mean received packets','rx','Packets received'); chart('#queue','Mean maximum queue occupancy','maxQueue','Packets'); }
  new ResizeObserver(draw).observe(root); draw();
})();
</script>
